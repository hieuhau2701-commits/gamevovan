<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anh Hùng Vô Danh - Đấu Trường</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: none; user-select: none; -webkit-user-select: none; }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
        }
        .anim-shake { animation: shake 0.4s; }
        @keyframes slash {
            0%, 100% { transform: translateX(0) scale(1); }
            50% { transform: translateX(20px) scale(1.1); }
        }
        .anim-attack { animation: slash 0.2s ease-in-out; }
        .track-slot { width: 60px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; border-bottom: 4px solid #4b5563; position: relative; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4 font-sans overflow-hidden">

    <div class="w-full max-w-lg flex flex-col gap-2 mb-4">
        <!-- Hàng 1: Cloud Account & Save/Load -->
        <div class="flex justify-between items-center bg-gray-800 p-2 rounded-xl shadow-md border border-gray-700 text-xs">
            <div class="text-gray-400">Người chơi: <span id="playerName" class="text-white font-bold truncate max-w-[100px] inline-block align-bottom">Đang tải...</span></div>
            <div class="flex space-x-2">
                <button id="saveBtn" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded shadow transition-transform active:scale-95 disabled:opacity-50 font-bold">💾 Lưu</button>
                <button id="loadBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded shadow transition-transform active:scale-95 disabled:opacity-50 font-bold">📂 Tải</button>
            </div>
        </div>

        <!-- Hàng 2: Wave & Gold -->
        <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl shadow-md border border-gray-700">
            <div>
                <span class="text-gray-400 text-sm">Cấp độ Quái:</span>
                <span id="waveDisplay" class="text-white font-bold ml-1 text-lg">1</span>
            </div>
            <div class="flex items-center bg-yellow-900/30 px-3 py-1 rounded-lg border border-yellow-700/50">
                <span class="text-xl mr-2">🪙</span>
                <span id="goldDisplay" class="text-yellow-400 font-bold text-xl">0</span>
            </div>
        </div>
    </div>

    <!-- Màn hình chiến đấu -->
    <div class="w-full max-w-lg bg-black border-4 border-gray-700 rounded-xl p-4 shadow-2xl relative mb-4">
        
        <div class="flex items-end justify-between h-40 mb-4">
            <!-- NHÂN VẬT -->
            <div id="heroCard" class="flex flex-col items-center w-24">
                <div class="w-full bg-gray-700 h-3 rounded-full mb-2 overflow-hidden border border-gray-600">
                    <div id="heroHpBar" class="bg-green-500 h-full transition-all duration-300" style="width: 100%"></div>
                </div>
                <div class="text-[10px] font-bold text-green-400 mb-1"><span id="heroHpText">50</span>/<span id="heroMaxHpText">50</span> HP</div>
                <div id="heroAvatar" class="text-6xl drop-shadow-lg z-10">🥷</div>
                <div class="flex space-x-2 mt-2 bg-gray-800 rounded px-2 py-1 border border-gray-600">
                    <div class="text-xs text-red-400 font-bold">⚔️ <span id="heroAtkText">5</span></div>
                    <div class="text-xs text-blue-400 font-bold">🛡️ <span id="heroDefText">0</span></div>
                </div>
            </div>

            <!-- ĐƯỜNG ĐI CỦA QUÁI VẬT -->
            <div class="flex space-x-1 pl-4" id="monsterTrack">
                <div class="track-slot" id="slot-0"></div>
                <div class="track-slot" id="slot-1"></div>
                <div class="track-slot" id="slot-2"></div>
                <div class="track-slot" id="slot-3"></div>
            </div>
        </div>

        <!-- Hàng chờ trang bị (10 ô) -->
        <div class="w-full mt-2 pt-3 border-t border-gray-800">
            <h4 class="text-[10px] text-gray-500 mb-2 uppercase tracking-wider font-bold">Trang bị hiện tại (Tối đa 10)</h4>
            <div id="inventoryUI" class="grid grid-cols-10 gap-1 h-10 w-full transition-transform">
                <!-- JS Render -->
            </div>
        </div>

        <div id="gameOverScreen" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-20 rounded-lg">
            <div class="text-5xl mb-4">💀</div>
            <h2 class="text-3xl font-bold text-red-500 mb-2">BẠN ĐÃ TỬ TRẬN</h2>
            <p id="finalScore" class="text-gray-400 mb-6">Sống sót đến cấp độ: 1</p>
            <button id="restartBtn" class="bg-white text-black font-bold py-2 px-6 rounded-full hover:bg-gray-200">Chơi lại từ đầu</button>
        </div>
    </div>

    <!-- Cửa Hàng Trang Bị -->
    <div class="w-full max-w-lg bg-gray-800 border border-gray-700 rounded-xl p-3 shadow-lg flex-grow flex flex-col mb-4">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-yellow-400 font-bold text-sm">🛒 CỬA HÀNG TRANG BỊ</h3>
            <div class="flex space-x-2">
                <button id="geminiForgeBtn" class="text-xs bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded shadow active:scale-95 transition-transform flex items-center font-bold animate-pulse">
                    ✨ Rèn Bí Ẩn (15 🪙)
                </button>
                <button id="refreshShopBtn" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded shadow active:scale-95 transition-transform flex items-center">
                    🔄 Mới (2 🪙)
                </button>
            </div>
        </div>
        
        <div class="flex space-x-2 flex-grow">
            <div id="shopSlots" class="grid grid-cols-5 gap-1 flex-grow">
                <!-- JS Render -->
            </div>
            
            <button id="attackBtn" class="w-20 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-bold rounded-lg shadow-lg border-b-4 border-red-800 active:border-b-0 active:translate-y-1 transition-all flex flex-col items-center justify-center flex-shrink-0">
                <span class="text-2xl mb-1">⚔️</span>
                <span class="text-xs">ĐÁNH</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // BƯỚC 4: DÁN LẠI FIREBASE CONFIG Ở ĐÂY Y HỆT FILE LOGIN
      const firebaseConfig = {
  apiKey: "AIzaSyAqJzVPjstw570AfjzhTL9V-wBgrffqTAk",
  authDomain: "hieu-abfde.firebaseapp.com",
  projectId: "hieu-abfde",
  storageBucket: "hieu-abfde.firebasestorage.app",
  messagingSenderId: "643223090105",
  appId: "1:643223090105:web:1c1e3f1ab2077d20e03c68",
  measurementId: "G-C5SXS702MB"
};
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'my-rpg-game-123';
        let currentUser = null;

        // DATA
        const itemDB = [
            { id: 'wp1', name: 'Dao găm', icon: '🗡️', type: 'weapon', atk: 3, def: 0, hp: 0, cost: 5 },
            { id: 'wp2', name: 'Kiếm Sắt', icon: '⚔️', type: 'weapon', atk: 8, def: 0, hp: 0, cost: 15 },
            { id: 'wp3', name: 'Rìu Chiến', icon: '🪓', type: 'weapon', atk: 15, def: 0, hp: 0, cost: 30 },
            { id: 'am1', name: 'Áo Vải', icon: '👕', type: 'armor', atk: 0, def: 2, hp: 10, cost: 8 },
            { id: 'am2', name: 'Giáp Da', icon: '🦺', type: 'armor', atk: 0, def: 5, hp: 25, cost: 18 },
            { id: 'am3', name: 'Giáp Sắt', icon: '🛡️', type: 'armor', atk: 0, def: 10, hp: 50, cost: 35 },
            { id: 'hd1', name: 'Mũ Sắt', icon: '🪖', type: 'head', atk: 1, def: 3, hp: 15, cost: 12 },
            { id: 'pt1', name: 'Bánh Mì', icon: '🥖', type: 'potion', atk: 0, def: 0, hp: 30, cost: 5, isConsumable: true, desc: 'Hồi 30 HP' },
            { id: 'pt2', name: 'Bình Máu', icon: '🧪', type: 'potion', atk: 0, def: 0, hp: 100, cost: 12, isConsumable: true, desc: 'Hồi 100 HP' },
            { id: 'ac1', name: 'Nhẫn Quỷ', icon: '💍', type: 'accessory', atk: 10, def: -2, hp: 0, cost: 25 }
        ];

        const monsterDB = [
            { name: 'Slime', emoji: '💧', baseHp: 15, baseAtk: 2, gold: 3 },
            { name: 'Dơi', emoji: '🦇', baseHp: 25, baseAtk: 4, gold: 5 },
            { name: 'Goblin', emoji: '👺', baseHp: 40, baseAtk: 7, gold: 8 },
            { name: 'Sói', emoji: '🐺', baseHp: 65, baseAtk: 10, gold: 12 },
            { name: 'Xương', emoji: '💀', baseHp: 90, baseAtk: 15, gold: 18 },
            { name: 'Quỷ', emoji: '🔥', baseHp: 150, baseAtk: 25, gold: 30 }
        ];

        // GAME STATE
        let hero = { hp: 50, maxHp: 50, atk: 5, def: 0, gold: 0, inventory: [] };
        let monster = null;
        let wave = 1;
        let currentShopItems = [];
        let isGameOver = false;

        // UI ELEMENTS
        const ui = {
            playerName: document.getElementById('playerName'),
            saveBtn: document.getElementById('saveBtn'),
            loadBtn: document.getElementById('loadBtn'),
            gold: document.getElementById('goldDisplay'),
            wave: document.getElementById('waveDisplay'),
            hpText: document.getElementById('heroHpText'),
            maxHpText: document.getElementById('heroMaxHpText'),
            hpBar: document.getElementById('heroHpBar'),
            atk: document.getElementById('heroAtkText'),
            def: document.getElementById('heroDefText'),
            heroAvatar: document.getElementById('heroAvatar'),
            shop: document.getElementById('shopSlots'),
            inventory: document.getElementById('inventoryUI'),
            attackBtn: document.getElementById('attackBtn'),
            refreshBtn: document.getElementById('refreshShopBtn'),
            geminiForgeBtn: document.getElementById('geminiForgeBtn'),
            gameOver: document.getElementById('gameOverScreen'),
            restartBtn: document.getElementById('restartBtn'),
            finalScore: document.getElementById('finalScore')
        };

        // CORE LOGIC
        function initGame() {
            hero = { hp: 50, maxHp: 50, atk: 5, def: 0, gold: 0, inventory: [] };
            wave = 1; isGameOver = false; ui.gameOver.classList.add('hidden');
            spawnMonster(); refreshShop(true); updateUI();
        }

        function spawnMonster() {
            const template = monsterDB[(wave - 1) % monsterDB.length];
            const multiplier = 1 + Math.floor((wave - 1) / monsterDB.length) * 1.5;
            monster = {
                name: template.name + (multiplier > 1 ? ` (Lv${wave})` : ''),
                emoji: template.emoji,
                maxHp: Math.floor(template.baseHp * multiplier),
                hp: Math.floor(template.baseHp * multiplier),
                atk: Math.floor(template.baseAtk * multiplier),
                gold: Math.floor(template.gold * multiplier),
                pos: 3
            };
            renderMonster();
        }

        function renderMonster() {
            for(let i = 0; i <= 3; i++) document.getElementById(`slot-${i}`).innerHTML = '';
            if (monster && monster.hp > 0) {
                document.getElementById(`slot-${monster.pos}`).innerHTML = `
                    <div class="text-xs font-bold text-red-400 mb-1">${monster.hp}❤️</div>
                    <div class="text-5xl drop-shadow-lg filter drop-shadow-[0_0_8px_rgba(255,0,0,0.5)]" id="monsterEmoji">${monster.emoji}</div>
                `;
            }
        }

        function updateUI() {
            ui.gold.textContent = hero.gold;
            ui.wave.textContent = wave;
            ui.hpText.textContent = hero.hp;
            ui.maxHpText.textContent = hero.maxHp;
            const hpPercent = Math.max(0, (hero.hp / hero.maxHp) * 100);
            ui.hpBar.style.width = `${hpPercent}%`;
            if (hpPercent < 30) ui.hpBar.className = "bg-red-500 h-full transition-all duration-300";
            else if (hpPercent < 60) ui.hpBar.className = "bg-yellow-400 h-full transition-all duration-300";
            else ui.hpBar.className = "bg-green-500 h-full transition-all duration-300";

            ui.atk.textContent = hero.atk; ui.def.textContent = hero.def;
            
            ui.inventory.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const slot = document.createElement('div');
                slot.className = "bg-gray-800 border border-gray-700 rounded flex items-center justify-center text-lg";
                if (i < hero.inventory.length) {
                    slot.innerHTML = hero.inventory[i].icon;
                    slot.title = hero.inventory[i].name;
                }
                ui.inventory.appendChild(slot);
            }
            renderShop();
        }

        function refreshShop(free = false) {
            if (!free) {
                if (hero.gold < 2) return;
                hero.gold -= 2; updateUI();
            }
            currentShopItems = [];
            for (let i = 0; i < 5; i++) {
                currentShopItems.push({ ...itemDB[Math.floor(Math.random() * itemDB.length)], sold: false });
            }
            renderShop();
        }

        function renderShop() {
            ui.shop.innerHTML = '';
            currentShopItems.forEach((item, idx) => {
                const el = document.createElement('div');
                const canBuy = hero.gold >= item.cost && !item.sold;
                el.className = `flex flex-col items-center justify-between py-2 px-1 rounded border ${item.sold ? 'bg-gray-800 border-gray-700 opacity-30' : 'bg-gray-700 border-gray-600 hover:border-gray-400 cursor-pointer shadow-inner'}`;
                
                let desc = item.isConsumable ? `+${item.hp} HP` : '';
                if (!item.isConsumable) {
                    if (item.atk) desc += `+${item.atk}⚔️`;
                    if (item.def) desc += `+${item.def}🛡️`;
                    if (item.hp) desc += `+${item.hp}❤️`;
                }
                el.innerHTML = `
                    <div class="text-2xl">${item.icon}</div>
                    <div class="text-[9px] font-bold mt-1 text-center truncate w-full">${item.name}</div>
                    <div class="text-[8px] text-gray-400 mt-1 h-3 truncate">${desc}</div>
                    <div class="mt-1 bg-black/50 px-1 rounded text-[10px] font-bold ${canBuy ? 'text-yellow-400' : 'text-red-500'}">${item.cost} 🪙</div>
                `;
                if (!item.sold) el.onclick = () => buyItem(idx);
                ui.shop.appendChild(el);
            });
        }

        function buyItem(idx) {
            const item = currentShopItems[idx];
            if (!item.isConsumable && hero.inventory.length >= 10) {
                ui.inventory.classList.remove('anim-shake'); void ui.inventory.offsetWidth; ui.inventory.classList.add('anim-shake');
                return;
            }
            if (hero.gold >= item.cost) {
                hero.gold -= item.cost; item.sold = true;
                if (item.isConsumable) {
                    hero.hp = Math.min(hero.maxHp, hero.hp + item.hp);
                } else {
                    hero.atk += item.atk || 0; hero.def += item.def || 0;
                    if (item.hp) { hero.maxHp += item.hp; hero.hp += item.hp; }
                    hero.inventory.push(item);
                }
                updateUI();
            }
        }

        function doTurn() {
            if (isGameOver) return;
            ui.heroAvatar.classList.remove('anim-attack'); void ui.heroAvatar.offsetWidth; ui.heroAvatar.classList.add('anim-attack');
            monster.hp -= hero.atk;
            
            const monsterEl = document.getElementById('monsterEmoji');
            if (monsterEl) { monsterEl.classList.remove('anim-shake'); void monsterEl.offsetWidth; monsterEl.classList.add('anim-shake'); }

            if (monster.hp <= 0) {
                hero.gold += monster.gold; wave++; updateUI();
                setTimeout(() => { spawnMonster(); updateUI(); }, 400);
                return;
            }

            setTimeout(() => {
                if (monster.pos > 0) { monster.pos--; } 
                else {
                    const dmg = Math.max(1, monster.atk - hero.def);
                    hero.hp -= dmg;
                    ui.heroAvatar.parentElement.classList.remove('anim-shake'); void ui.heroAvatar.parentElement.offsetWidth; ui.heroAvatar.parentElement.classList.add('anim-shake');
                    if (hero.hp <= 0) { hero.hp = 0; isGameOver = true; ui.finalScore.textContent = `Sống sót đến cấp độ: ${wave}`; ui.gameOver.classList.remove('hidden'); }
                }
                renderMonster(); updateUI();
            }, 300);
            renderMonster();
        }

        // BIND EVENTS
        ui.attackBtn.addEventListener('click', () => { if (!isGameOver) doTurn(); });
        ui.refreshBtn.addEventListener('click', () => { if (!isGameOver) refreshShop(false); });
        ui.restartBtn.addEventListener('click', initGame);

        // HỆ THỐNG THẦN RÈN AI
        ui.geminiForgeBtn.addEventListener('click', async () => {
            if (isGameOver || hero.gold < 15) return;
            hero.gold -= 15; updateUI();
            
            ui.geminiForgeBtn.disabled = true; ui.geminiForgeBtn.innerHTML = "⏳ Đang rèn..."; ui.geminiForgeBtn.classList.remove("animate-pulse");

            try {
                const apiKey = ""; // API KEY tự động của hệ thống
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const prompt = `Tạo trang bị game RPG ngẫu nhiên. Wave hiện tại: ${wave}. atk: 5-${10+wave*3}, def: 2-${5+wave*2}, hp: 10-${50+wave*10}. Tên hài hước tiếng Việt.`;
                
                const response = await fetch(url, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: { name: { type: "STRING" }, icon: { type: "STRING" }, type: { type: "STRING" }, atk: { type: "INTEGER" }, def: { type: "INTEGER" }, hp: { type: "INTEGER" } },
                                required: ["name", "icon", "type", "atk", "def", "hp"]
                            }
                        }
                    })
                });
                const data = await response.json();
                const itemData = JSON.parse(data.candidates[0].content.parts[0].text);
                
                currentShopItems[0] = {
                    id: 'gemini_' + Date.now(), name: "✨ " + itemData.name, icon: itemData.icon, type: itemData.type,
                    atk: itemData.atk, def: itemData.def, hp: itemData.hp, cost: 0, sold: false, isConsumable: false
                };
                renderShop();
                ui.geminiForgeBtn.innerHTML = "✨ Hoàn tất!";
            } catch (err) {
                console.error("Lỗi rèn:", err); ui.geminiForgeBtn.innerHTML = "❌ Lỗi"; hero.gold += 15; updateUI();
            } finally {
                setTimeout(() => { ui.geminiForgeBtn.disabled = false; ui.geminiForgeBtn.innerHTML = "✨ Rèn Bí Ẩn (15 🪙)"; ui.geminiForgeBtn.classList.add("animate-pulse"); }, 2000);
            }
        });

        // HỆ THỐNG ĐÁM MÂY (FIREBASE CLOUD)
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                ui.playerName.textContent = `ID_${user.uid.slice(0, 8).toUpperCase()}`; 
            } else {
                if (window.location.protocol.startsWith('blob')) {
                    ui.playerName.textContent = "Chưa đăng nhập";
                    console.warn("Chế độ xem trước không hỗ trợ chuyển trang tự động.");
                } else {
                    try {
                        window.location.href = "login.html"; // Ép quay lại đăng nhập nếu chưa auth
                    } catch (e) {
                        console.error("Lỗi chuyển hướng:", e);
                    }
                }
            }
        });

        ui.saveBtn.addEventListener('click', async () => {
            if (!currentUser || !db) return;
            ui.saveBtn.textContent = "⏳..."; ui.saveBtn.disabled = true;
            try {
                const saveRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'gamedata', 'save1');
                await setDoc(saveRef, { hero, wave, monster, currentShopItems });
                ui.saveBtn.textContent = "✅ OK";
            } catch (e) { console.error(e); ui.saveBtn.textContent = "❌ Lỗi"; }
            setTimeout(() => { ui.saveBtn.textContent = "💾 Lưu"; ui.saveBtn.disabled = false; }, 2000);
        });

        ui.loadBtn.addEventListener('click', async () => {
            if (!currentUser || !db) return;
            ui.loadBtn.textContent = "⏳..."; ui.loadBtn.disabled = true;
            try {
                const saveRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'gamedata', 'save1');
                const docSnap = await getDoc(saveRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    hero = data.hero; wave = data.wave; monster = data.monster; currentShopItems = data.currentShopItems || [];
                    isGameOver = false; ui.gameOver.classList.add('hidden');
                    updateUI(); renderMonster();
                    ui.loadBtn.textContent = "✅ Đã tải";
                } else ui.loadBtn.textContent = "❌ Rỗng";
            } catch (e) { console.error(e); ui.loadBtn.textContent = "❌ Lỗi"; }
            setTimeout(() => { ui.loadBtn.textContent = "📂 Tải"; ui.loadBtn.disabled = false; }, 2000);
        });

        initGame();
    </script>
</body>
</html>
